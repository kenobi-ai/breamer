<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>Arimo</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>Arimo</family>
      <family>Inter</family>
      <family>Nimbus Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer>
      <family>Inter</family>
      <family>Arimo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Times New Roman</family>
    <prefer>
      <family>Tinos</family>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Georgia</family>
    <prefer>
      <family>Gelasio</family>
      <family>TeX Gyre Schola</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Courier New</family>
    <prefer>
      <family>Cousine</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Consolas</family>
    <prefer>
      <family>Cascadia Mono</family>
      <family>Cousine</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Menlo</family>
    <prefer>
      <family>Cascadia Mono</family>
      <family>Hack</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Cambria</family>
    <prefer>
      <family>Caladea</family>
      <family>Tinos</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Verdana</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Open Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Tahoma</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Open Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer>
      <family>Fira Sans</family>
      <family>Open Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>Roboto</family>
      <family>Open Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro Text</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro Display</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>SF Pro Rounded</family>
    <prefer>
      <family>Inter</family>
      <family>Nunito</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>San Francisco</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>.SF NS Text</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>.SF NS Display</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>.AppleSystemUIFont</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Apple System</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Avenir</family>
    <prefer>
      <family>Nunito Sans</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Avenir Next</family>
    <prefer>
      <family>Nunito Sans</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>-apple-system</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>Arimo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Arimo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>TeX Gyre Termes</family>
      <family>Tinos</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Cascadia Mono</family>
      <family>Cousine</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Arimo</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Tinos</family>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cousine</family>
      <family>Fira Code</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>Material Icons</family>
    <prefer>
      <family>Material Icons</family>
      <family>Material Design Icons</family>
    </prefer>
  </alias>

  <alias>
    <family>Material Symbols Outlined</family>
    <prefer>
      <family>Material Symbols Outlined</family>
      <family>Material Icons</family>
    </prefer>
  </alias>

  <alias>
    <family>FontAwesome</family>
    <prefer>
      <family>FontAwesome</family>
      <family>ForkAwesome</family>
    </prefer>
  </alias>

  <alias>
    <family>Font Awesome 5 Free</family>
    <prefer>
      <family>FontAwesome</family>
      <family>ForkAwesome</family>
    </prefer>
  </alias>

  <alias>
    <family>Font Awesome 6 Free</family>
    <prefer>
      <family>FontAwesome</family>
      <family>ForkAwesome</family>
    </prefer>
  </alias>

  <alias>
    <family>Font Awesome 6 Brands</family>
    <prefer>
      <family>FontAwesome</family>
      <family>ForkAwesome</family>
    </prefer>
  </alias>

  <alias>
    <family>Apple Color Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Symbola</family>
    </prefer>
  </alias>

  <alias>
    <family>Segoe UI Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Symbola</family>
    </prefer>
  </alias>
</fontconfig>
